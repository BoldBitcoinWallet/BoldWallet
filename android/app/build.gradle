apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

// Enable R8/ProGuard for release builds
// Set to false if you encounter runtime issues after enabling
// Note: Disabling this will prevent generating mapping.txt for Play Console
def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseProperties = new Properties()
if (rootProject.file('release.properties').exists()) {
    releaseProperties.load(new FileInputStream(rootProject.file('release.properties')))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.boldwallet"
    defaultConfig {
        applicationId "com.boldwallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 66
        versionName "4.0.5"
        missingDimensionStrategy 'react-native-camera', 'general'
        // Match main: oldarch flavor with newArchEnabled=true in gradle.properties (RN 0.82).
        missingDimensionStrategy 'react-native-arch', 'oldarch'
        
        // 16KB page size support
        // Include x86_64 so stock Google emulators (x86_64 images) can load libreactnative.so.
        // ARM-only APKs crash on launch with SoLoader: couldn't find libreactnative.so on those AVDs.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-O2"
                arguments "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=0x4000", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // Reduce parallel jobs for C++ builds to avoid QEMU linker crashes
                arguments "-DCMAKE_BUILD_PARALLEL_LEVEL=2"
            }
        }
    }
    
    // 16KB page size configuration
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        packagingOptions {
            // Exclude DNSSD libraries since we're using NSD
            exclude '**/libjdns_sd.so'
            exclude '**/libjdns_sd_embedded.so'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseProperties.getProperty('MYAPP_UPLOAD_STORE_FILE') != null &&
                releaseProperties.getProperty('MYAPP_UPLOAD_KEY_ALIAS') != null &&
                releaseProperties.getProperty('MYAPP_UPLOAD_STORE_PASSWORD') != null &&
                releaseProperties.getProperty('MYAPP_UPLOAD_KEY_PASSWORD') != null) {
                storeFile rootProject.file(releaseProperties.getProperty('MYAPP_UPLOAD_STORE_FILE'))
                storePassword releaseProperties.getProperty('MYAPP_UPLOAD_STORE_PASSWORD')
                keyAlias releaseProperties.getProperty('MYAPP_UPLOAD_KEY_ALIAS')
                keyPassword releaseProperties.getProperty('MYAPP_UPLOAD_KEY_PASSWORD')
            } else {
                // Fallback to debug keystore if release config not found
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            shrinkResources enableProguardInReleaseBuilds
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Same EncryptedSharedPreferences contract as react-native-encrypted-storage (RNES) for native keyshare reads
    implementation "androidx.security:security-crypto:1.1.0-alpha03"
    // Single Go runtime: libbbmtmobile.so + dkls_jni (BBMTLib/build-dkls.sh android).
    // GG18 + DKLs both route through Bbmt*/Dkls* JNI — no gomobile tss.aar.
    implementation project(':react-native-fs')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-device-info')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-biometrics')
    implementation project(':react-native-share')
    implementation project(':react-native-svg')
    implementation project(':react-native-document-picker')
    implementation project(':rn-barcode-zxing-scan')
    implementation project(':react-native-haptic-feedback')
}
