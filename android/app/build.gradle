apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.boldwallet"
    defaultConfig {
        applicationId "com.boldwallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.4.0"
        missingDimensionStrategy 'react-native-camera', 'general'
        missingDimensionStrategy 'react-native-arch', 'oldarch'
        
        // 16KB page size support
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-O2"
                arguments "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=0x4000", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    
    // 16KB page size configuration
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        packagingOptions {
            // Exclude DNSSD libraries since we're using NSD
            exclude '**/libjdns_sd.so'
            exclude '**/libjdns_sd_embedded.so'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE') && 
                project.hasProperty('MYAPP_UPLOAD_STORE_PASSWORD') &&
                project.hasProperty('MYAPP_UPLOAD_KEY_ALIAS') &&
                project.hasProperty('MYAPP_UPLOAD_KEY_PASSWORD')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else {
                // Fallback to debug keystore if release config not found
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            shrinkResources false
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation(files("libs/tss.aar"))
    implementation project(':react-native-fs')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-device-info')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-biometrics')
    implementation project(':react-native-share')
    implementation project(':react-native-svg')
    implementation project(':react-native-document-picker')
    implementation project(':rn-barcode-zxing-scan')
    implementation project(':react-native-haptic-feedback')
}
