# Optimized for local builds (native Linux/macOS, no QEMU emulation)
# Use more aggressive settings since you have full system resources
# Allocate more memory and use more parallel workers for faster builds

# Memory allocation - adjust based on your system RAM
# Recommended: 50-70% of available RAM (e.g., 8GB for 16GB system)
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200

org.gradle.parallel=true
org.gradle.caching=true

# Use more workers for local builds (adjust based on CPU cores)
# Recommended: Number of CPU cores - 2 (e.g., 6 workers for 8-core CPU)
org.gradle.workers.max=6

# Kotlin daemon with more memory for local builds
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
kotlin.incremental=true

# Disable configuration cache - React Native doesn't fully support it yet
org.gradle.configuration-cache=false

# Enable build cache for faster subsequent builds
org.gradle.build-cache=true

android.useAndroidX=true

# Build all architectures for local builds (no QEMU issues)
# You can reduce this if you only need ARM: reactNativeArchitectures=armeabi-v7a,arm64-v8a
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true

VisionCamera_enableCodeScanner=false

# 16KB page size support
android.enableJetifier=true

