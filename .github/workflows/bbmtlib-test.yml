name: BBMTLib Tests

on:
  pull_request:
    paths:
      - 'BBMTLib/**'
      - '.github/workflows/bbmtlib-test.yml'
      - '.github/actions/setup-libtss/**'
  workflow_dispatch:

jobs:
  test:
    name: Test BBMTLib
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    
    defaults:
      run:
        working-directory: ./BBMTLib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup libtss
        uses: ./.github/actions/setup-libtss

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: BBMTLib/go.sum

      - name: Verify Go version
        run: go version

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Tidy dependencies
        run: go mod tidy

      - name: Check for uncommitted changes after go mod tidy
        id: check-tidy
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "modified=true" >> $GITHUB_OUTPUT
            echo "⚠️  go.mod or go.sum has uncommitted changes after 'go mod tidy'"
            echo "This usually means some dependencies need to be cleaned up."
            echo ""
            echo "To fix:"
            echo "  1. Run 'go mod tidy' locally in the BBMTLib directory"
            echo "  2. Commit the changes to go.mod and go.sum"
            echo ""
            echo "Changes detected:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          else
            echo "modified=false" >> $GITHUB_OUTPUT
            echo "✓ go.mod and go.sum are clean"
          fi

      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.out ./...
        continue-on-error: true

      - name: Build all packages
        run: go build ./...

      - name: Build scripts helper
        run: go build -o /tmp/bbmtlib-scripts ./scripts/main.go

      - name: Test scripts helper commands
        run: |
          /tmp/bbmtlib-scripts random | head -c 64
          echo ""
          /tmp/bbmtlib-scripts nostr-keypair | grep -q ","
          echo "✓ Scripts helper commands work"

      - name: Build nostr-keygen command
        run: go build -o /tmp/nostr-keygen ./tss/cmd/nostr-keygen

      - name: Build nostr-keysign command
        run: go build -o /tmp/nostr-keysign ./tss/cmd/nostr-keysign

      - name: Verify scripts are executable
        run: |
          chmod +x scripts/*.sh
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              echo "✓ $script is executable"
            fi
          done

      - name: Install jq (for JSON validation)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify Docker is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "❌ Docker is required for running tests with local relay"
            exit 1
          fi
          docker --version
          echo "✓ Docker is available"

      - name: Pull Nostr relay Docker image
        run: |
          # Pre-pull the image so Docker can use its built-in cache
          # Docker on GitHub Actions automatically caches images between runs
          echo "Pulling nostr-rs-relay Docker image..."
          docker pull scsibug/nostr-rs-relay:latest || {
            echo "❌ Failed to pull nostr-rs-relay image"
            exit 1
          }
          echo "✓ Nostr relay image ready (Docker will cache this for subsequent runs)"

      - name: Start local Nostr relay
        run: |
          echo "Starting local Docker-based Nostr relay..."
          chmod +x scripts/*.sh
          if ! ./scripts/start-local-relay.sh; then
            echo "❌ Failed to start local relay. Tests require a local Docker-based relay."
            echo "Relay container status:"
            docker ps -a | grep bbmtlib-test-relay || echo "No relay container found"
            exit 1
          fi
          echo "✓ Local relay is running at ws://localhost:7777"
          
          # Verify relay is actually accessible
          if ! docker ps --format '{{.Names}}' | grep -q "^bbmtlib-test-relay$"; then
            echo "❌ Relay container is not running"
            exit 1
          fi

      - name: Run comprehensive script tests
        env:
          RELAYS: "ws://localhost:7777"
          REQUIRE_LOCAL_RELAY: "true"
        run: |
          echo "Running comprehensive test suite for all scripts..."
          echo "Using local relay: $RELAYS"
          echo "Local relay is required - tests will fail if relay is unavailable"
          
          # Verify relay is still running before tests
          if ! docker ps --format '{{.Names}}' | grep -q "^bbmtlib-test-relay$"; then
            echo "❌ Local relay container is not running. Tests cannot proceed."
            exit 1
          fi
          
          ./scripts/test-all.sh

      - name: Stop local Nostr relay
        if: always()
        run: |
          echo "Stopping local relay..."
          ./scripts/stop-local-relay.sh || true

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck (if available)
        run: |
          if command -v staticcheck &> /dev/null || go install honnef.co/go/tools/cmd/staticcheck@latest; then
            staticcheck ./... || true
          else
            echo "staticcheck not available, skipping"
          fi
        continue-on-error: true

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          else
            echo "✓ Code is properly formatted"
          fi

      - name: Upload coverage (if tests ran)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: bbmtlib
          name: bbmtlib-coverage
          fail_ci_if_error: false
        continue-on-error: true
